<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} · {{ site.Title }}{{ end }}</title>
  <meta name="description" content="{{ if .Description }}{{ .Description }}{{ else }}{{ site.Params.description }}{{ end }}">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="alternate" type="application/rss+xml" title="RSS" href="/index.xml">
</head>
<body>
  <div class="site-shell">
    <header class="header">
      <a class="brand" href="/" aria-label="LimbMove Blog 首页"><span class="brand-mark">L</span><span>LimbMove<span class="brand-suffix"> / blog</span></span></a>
      <nav class="nav" aria-label="主导航">
        <a href="/">首页</a>
        <a href="/posts/">文章</a>
        <a href="/about/">关于</a>
      </nav>
    </header>
    <main id="content">{{ block "main" . }}{{ end }}</main>
    <footer class="footer">
      <span>© {{ now.Year }} LimbMove Blog</span>
      <span>Powered by <a href="https://gohugo.io/">Hugo</a> · Hosted on <a href="https://pages.cloudflare.com/">Cloudflare Pages</a></span>
    </footer>
  </div>
</body>
</html>
