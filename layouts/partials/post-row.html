<article class="post-row">
  <a href="{{ .RelPermalink }}" class="post-link">
    <div class="post-date"><time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006.01.02" }}</time><span>{{ .ReadingTime }} 分钟阅读</span></div>
    <div class="post-copy">
      <h3>{{ .Title }}</h3>
      <p>{{ .Description | default (.Summary | plainify | truncate 120) }}</p>
    </div>
    <span class="post-arrow" aria-hidden="true">↗</span>
  </a>
</article>
