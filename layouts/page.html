{{ define "main" }}
  <article class="article">
    <a href="{{ if eq .Section "posts" }}/posts/{{ else }}/{{ end }}" class="back">← 返回{{ if eq .Section "posts" }}文章列表{{ else }}首页{{ end }}</a>
    <header class="article-header"><p class="section-kicker">{{ if eq .Section "posts" }}JOURNAL ENTRY{{ else }}ABOUT{{ end }}</p><h1>{{ .Title }}</h1>{{ if eq .Section "posts" }}<p class="meta"><time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006年01月02日" }}</time> · {{ .ReadingTime }} 分钟阅读</p>{{ end }}</header>
    <div class="prose">{{ .Content }}</div>
    <div class="article-end"><a href="/posts/">浏览更多文章 →</a></div>
  </article>
{{ end }}
