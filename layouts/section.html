{{ define "main" }}
  <section class="list-page">
    <header class="page-heading"><p class="section-kicker" lang="en">ALL ARTICLES</p><h1>{{ .Title }}<span class="section-count">{{ printf "%02d" (len .RegularPages) }}</span></h1><p class="list-intro">{{ .Description }}</p></header>
    {{ with .Content }}<div class="prose section-content">{{ . }}</div>{{ end }}
    <div class="post-list">
      {{ range .RegularPages.ByDate.Reverse }}
        {{ partial "post-row.html" . }}
      {{ else }}
        <p class="empty">还没有文章，敬请期待。</p>
      {{ end }}
    </div>
  </section>
{{ end }}
