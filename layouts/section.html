{{ define "main" }}
  <section class="list-page"><div class="section-kicker">ALL ARTICLES</div><h1>{{ .Title }}</h1><p class="list-intro">{{ .Description }}</p><div class="post-list">
  {{ range .Pages.ByDate.Reverse }}
    <article class="post-row"><a href="{{ .RelPermalink }}" class="post-link"><div><time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006 / 01 / 02" }}</time><h3>{{ .Title }}</h3><p>{{ .Summary | plainify | truncate 120 }}</p></div><span class="post-arrow" aria-hidden="true">↗</span></a></article>
  {{ end }}
  </div></section>
{{ end }}
