baseURL = 'https://blog.limbmove.com/'
title = 'LimbMove Blog'
locale = 'zh-CN'
defaultContentLanguage = 'zh'
enableRobotsTXT = true
hasCJKLanguage = true
timeZone = 'Asia/Shanghai'

[params]
  description = '记录技术探索、学习笔记与生活灵感。'
  subtitle = 'Notes on engineering, ideas and everyday discoveries.'
  author = 'LimbMove'

[markup.goldmark.renderer]
  unsafe = false

[markup.highlight]
  style = 'github-dark'
  noClasses = true

[markup.tableOfContents]
  startLevel = 2
  endLevel = 3
  ordered = false
